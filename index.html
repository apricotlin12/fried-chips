<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script>
    fetch("head.html")
      .then(res => res.text())
      .then(html => {
        document.head.innerHTML += html;
      });
  </script>
</head>
<body>

<!-- header -->
<div id="header-placeholder"></div>

<!-- 主內容 -->
<main>
  <div class="now-event">
    <h4>相關連結：</h4>
    <div class="list-group">
      <a href="https://x.com/TOUKEN_STAFF" target="_blank" class="list-group-item list-group-item-action list-group-item-warning">刀剣乱舞ONLINE【運営】</a>
    </div>
  </div>
  </br>
  <p>距離（台灣時間 yy/dd () HH:MM）還有</p>
  <h2 id="timer"></h2>
  <div id="open-door-placeholder"></div>
  </br>
  <div class="link-container">
    <a href="https://docs.google.com/spreadsheets/d/19JBK5QpqIJ7r-_mHh8leXSDP6ZIHk1JYhGR2Vw0puZM/edit?usp=sharing" target="_blank" class="btn btn-outline-warning">拍門許願池</a>
  </div>
</main>

<!-- footer -->
<div id="footer-placeholder"></div>

<script src="js/import-html.js"></script>
<script src="js/countdown.js"></script>
<script>
  const FALLBACK_TIMES = {
    ACTIVITY_END: "2205-01-14T12:00:00+08:00",
    OPEN_DOOR: "2205-01-14T15:00:00+08:00"
  };

  const GOOGLE_SHEET_ID = "1udbndPKRsigDa4XuOBDiQqQSfzdqZO37iMZTp2Ij7yk";
  const GOOGLE_SHEET_GID = "0";

  // 將 Sheet 中的台灣時間轉成帶有時區的 ISO 格式。
  function parseTaiwanDateTime(value) {
    const match = String(value || '').trim().match(
      /^(\d{4})[/-](\d{1,2})[/-](\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?$/
    );
    if (!match) return null;

    const [, year, month, day, hour, minute, second = '00'] = match;
    const pad = number => String(number).padStart(2, '0');
    const iso = `${year}-${pad(month)}-${pad(day)}T${pad(hour)}:${minute}:${second}+08:00`;
    return Number.isNaN(new Date(iso).getTime()) ? null : iso;
  }

  // 資料可持續往下新增：依開始時間排序並使用日期最新的一筆。
  function selectSchedule(rows) {
    const schedules = rows
      .map(row => ({
        ACTIVITY_END: parseTaiwanDateTime(row.c?.[0]?.v),
        OPEN_DOOR: parseTaiwanDateTime(row.c?.[1]?.v),
        note: String(row.c?.[2]?.v || '').trim()
      }))
      .filter(schedule => {
        if (!schedule.ACTIVITY_END || !schedule.OPEN_DOOR) return false;
        return new Date(schedule.ACTIVITY_END) < new Date(schedule.OPEN_DOOR);
      })
      .sort((a, b) => new Date(a.ACTIVITY_END) - new Date(b.ACTIVITY_END));

    if (!schedules.length) throw new Error('Google Sheet 中沒有有效的時間資料');

    return schedules[schedules.length - 1];
  }

  // 使用 JSONP 讀取公開 Sheet，避免純靜態網站的跨網域限制。
  function loadTimesFromSheet() {
    return new Promise((resolve, reject) => {
      const callbackName = `handleSheetResponse_${Date.now()}`;
      const script = document.createElement('script');
      const timeoutId = setTimeout(() => finish(new Error('Google Sheet 載入逾時')), 10000);

      function cleanup() {
        clearTimeout(timeoutId);
        delete window[callbackName];
        script.remove();
      }

      function finish(error, value) {
        cleanup();
        if (error) reject(error);
        else resolve(value);
      }

      window[callbackName] = response => {
        if (response?.status !== 'ok') {
          finish(new Error(response?.errors?.[0]?.detailed_message || 'Google Sheet 回應錯誤'));
          return;
        }

        try {
          finish(null, selectSchedule(response.table?.rows || []));
        } catch (error) {
          finish(error);
        }
      };

      const query = encodeURIComponent('select A, B, C where A is not null');
      const tqx = encodeURIComponent(`out:json;responseHandler:${callbackName}`);
      script.src = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?gid=${GOOGLE_SHEET_GID}&headers=1&tqx=${tqx}&tq=${query}&cacheBust=${Date.now()}`;
      script.onerror = () => finish(new Error('無法載入 Google Sheet'));
      document.head.appendChild(script);
    });
  }

  function initializePage(TIMES) {
  const currentTime = Date.now();

  // 將 ISO 時間格式化成頁面上顯示的台灣時間標籤，例如：台灣時間 10/21 (二) 12:00
  function formatTaiwanLabel(iso) {
    const d = new Date(iso);
    const tz = 'Asia/Taipei';
    const parts = new Intl.DateTimeFormat('zh-Hant', {
      timeZone: tz,
      month: 'numeric',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false,
      weekday: 'short'
    }).formatToParts(d).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
    // 將「星期二」或「週二」之類轉成單字（例：二）
    const weekdayMap = {
      '星期一': '一',
      '星期二': '二',
      '星期三': '三',
      '星期四': '四',
      '星期五': '五',
      '星期六': '六',
      '星期日': '日',
      '週一': '一',
      '週二': '二',
      '週三': '三',
      '週四': '四',
      '週五': '五',
      '週六': '六',
      '週日': '日'
    };
    const w = weekdayMap[parts.weekday] || (parts.weekday ? parts.weekday.replace(/星期|週/, '') : '');
    return `台灣時間 ${parts.month}/${parts.day} (${w}) ${parts.hour}:${parts.minute}`;
  }

  // 初始化 main p 的顯示（原本是硬編碼的時間）
  const pTag = document.querySelector('main p');
  if (pTag) pTag.textContent = `距離（${formatTaiwanLabel(TIMES.ACTIVITY_END)}）還有`;

  const activityEndTimestamp = new Date(TIMES.ACTIVITY_END).getTime();
  const openDoorTimestamp = new Date(TIMES.OPEN_DOOR).getTime();

  // 如果現在已經過了活動結束時間，就換倒數開門
  if (currentTime >= activityEndTimestamp) {
    startCountdown({
      targetTime: TIMES.OPEN_DOOR,
      elementId: "timer",
      endText: "開門啦！"
    });
  } else {
    startCountdown({
      targetTime: TIMES.ACTIVITY_END,
      elementId: "timer",
      endText: "關門啦！"
    });
  }

  const targetTime = activityEndTimestamp;
  const soundTime = openDoorTimestamp;
  let soundPlayed = false;

  /**
   * 根據距離目標時間，決定下次檢查的間隔
   * - 距離目標時間 > 30 分鐘：每 5 分鐘檢查一次
   * - 距離目標時間 > 2 分鐘且 <= 30 分鐘：每分鐘檢查一次
   * - 距離目標時間 <= 2 分鐘：每秒檢查一次
   * @param {number} targetTimestamp 目標時間的 timestamp
   * @returns {number} 毫秒間隔
   */
  function getCheckInterval(targetTimestamp) {
    const now = Date.now();
    const diff = targetTimestamp - now;
    if (diff > 30 * 60 * 1000) {
      return 5 * 60 * 1000; // 5分鐘
    } else if (diff > 2 * 60 * 1000) {
      return 60 * 1000; // 1分鐘
    } else {
      return 1000; // 1秒
    }
  }

  // 處理 open-the-door.html 的載入
  function handleOpenDoorHtml() {
    const now = Date.now();
    if (now >= targetTime && now < soundTime) {
      document.getElementById('open-door-placeholder').style.display = '';
      const audio = new Audio("sound/可是瑞凡_我回不去了.mp3");
      audio.play();
      fetch('open-the-door.html')
        .then(res => res.text())
        .then(data => {
          document.getElementById('open-door-placeholder').innerHTML = data;
          if (typeof initOpenDoor === 'function') initOpenDoor();
        });
    } else {
      setTimeout(handleOpenDoorHtml, getCheckInterval(targetTime));
    }
  }

  // 處理音效播放與隱藏
  function handleOpenDoorSound() {
    const now = Date.now();
    if (now >= soundTime && !soundPlayed) {
      soundPlayed = true;
      document.getElementById('open-door-placeholder').style.display = 'none';
      document.getElementById('timer').textContent = "開門啦！";
      const audio = new Audio("sound/全家便利商店_舊版.mp3");
      audio.play();
    } else if (!soundPlayed) {
      setTimeout(handleOpenDoorSound, getCheckInterval(soundTime));
    }
  }

  // 強制載入 open-the-door.html (備用)
  function forceLoadOpenDoorHtml() {
    const placeholder = document.getElementById('open-door-placeholder');
    placeholder.style.display = '';
    fetch('open-the-door.html')
      .then(res => res.text())
      .then(data => {
        placeholder.innerHTML = data;
        if (typeof initOpenDoor === 'function') initOpenDoor();
      });
  }

  // ACTIVITY_END_TIME 時間到了以後，修改活動倒數標籤內容
  function updateEndText() {
    const now = Date.now();
    if (now >= targetTime) {
      const pTag = document.querySelector('main p');
      if (pTag) pTag.textContent = `距離開門（${formatTaiwanLabel(TIMES.OPEN_DOOR)}）還有`;
    } else {
      setTimeout(updateEndText, getCheckInterval(targetTime));
    }
  }

  updateEndText();
  handleOpenDoorHtml();
  handleOpenDoorSound();
  }

  loadTimesFromSheet()
    .then(initializePage)
    .catch(error => {
      console.error(`${error.message}，改用頁面內建時間。`);
      initializePage(FALLBACK_TIMES);
    });
</script>
<script src="js/open-the-door.js"></script>
</body>
</html>
